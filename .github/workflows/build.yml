---
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build_acap:
    name: Build ACAP packages
    runs-on: ubuntu-latest
    env:
      DEBIAN_FRONTEND: noninteractive
    strategy:
      matrix:
        # Build both current and ACAP 3 version
        directory: [".", "acap3"]
    steps:
      - uses: actions/checkout@v6
      # Test all Makefile targets and make sure the ACAP files are created
      - name: Build
        run: ${{ matrix.directory }}/build.sh
      - name: Verify
        run: |
          for f in *.eap; do
          echo "Verification of $f:"
          tar tzf "$f"
          done
